<!DOCTYPE HTML>
<html>
	<head>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
		<title>form</title>
		<style>
			label, h1 {
			  font-family: "Bitcount Ink", system-ui;
			  font-optical-sizing: auto;
			  font-weight: <weight>;
			  font-style: normal;
			  font-variation-settings:
				"slnt" 0,
				"CRSV" 0.5,
				"ELSH" 0,
				"ELXP" 0,
				"SZP1" 0,
				"SZP2" 0,
				"XPN1" 0,
				"XPN2" 0,
				"YPN1" 0,
				"YPN2" 0;
			}
			*{
			  font-family: "Google Sans", sans-serif;
			  font-optical-sizing: auto;
			  font-weight: <weight>;
			  font-style: normal;
			  font-variation-settings:
				"GRAD" 0;
			}
			body{
				padding:10px 23%;
				color:lightgray;
				background-image: radial-gradient( circle 490.7px at 3.1% 21.8%,  rgba(82,6,135,1) 0%, rgba(22,1,34,1) 100.3% );
			}
			.btn-grad {
			  background-image: linear-gradient(to right, #614385 0%, #516395 51%, #614385 100%);
			}

			.btn-grad {
			  margin:20px 37%;
			  padding: 10px 45px;
			  text-align: center;
			  text-transform: uppercase;
			  transition: 0.5s;
			  background-size: 200% auto;
			  color: white;
			  font-weight:800;
			  box-shadow: 0 0 20px #eee;
			  border-radius: 10px;
			  display: block;
			  outline: none;
			  border: none;
			}

			.btn-grad:hover {
			  background-position: right center;
			  color: #fff;
			  text-decoration: none;
			}
			header{
				text-align:center;
			}
			header h1{
				margin-top:0px;
				font-size:45px;
			}
			header a{
				padding:0px 20px;
				font-size:18px;
				fontweight:500;
			}
			label{
				font-size:25px;
			}
			label , input , select {
				margin-bottom:40px;

			}
			input{
				border:none;
				border-radius:10px;
				height:30px;
				margin-left:20px;
				width:200px;
				background-image: linear-gradient(to top, #d299c2 0%, #fef9d7 100%);
			}
			.dot{
				margin:0px;
			}
			.center{
				margin:20px 35%;
			}
			fieldset{
				background-color:darkbrown;
				border-radius:20px;
				border:none;
				box-shadow:0 0 20px lightgray;
			}
			select{
				height:40px;
				width:200px;
				border-radius:10px;
				margin-left:10px;
				background-image: linear-gradient(to top, #d299c2 0%, #fef9d7 100%);
			}
		</style>
	</head>
	<body>
		<fieldset>
			<header>
				<h1>Acme Support</h1>
				<a> Home</a>
				<a> Help</a>
				<a> Contact</a>
			</header>
			<hr>
			<h1 style="margin-bottom:50px; text-align:center;"> Contact Us </h1>
			<!-- <p>Send us a message and we will get back to you</p> -->
			<form method="post" accept-charset="UTF-8">
				<label>Name:</label>
				<input type="text" placeholder="Name" style="margin-left:50px;">
				<label style="margin-left:50px;">Surname:</label>
				<input type="text" placeholder="surname">
				<br>
				<label>Email:</label>
				<input type="email" placeholder="eg.., xyz@.com" style="margin-left:35px;">
				<label style="margin-left:65px;">Number:</label>
				<input type="number" placeholder="eg.., 1234567890">
				<br>
				<label>Subject:</label>
				<select>
					<optgroup label="TECH-LANG">
					<option>HTML</option>
					<option>CSS</option>
					<option>JS</option>
					<option>Node</option>
					</optgroup>
					<optgroup label="NORMAL-LANG">
					<option>Hindi</option>
					<option>Marathi</option>
					<option>English</option>
					<option>Malayalam</option>
					</optgroup>
				</select>
				<br>
				<label>Message:</label><br>
				<br>
				<textarea rows="9" cols="115" placeholder="Drop down something" style="margin-bottom:10px;				background-image: linear-gradient(to top, #d299c2 0%, #fef9d7 100%);
"></textarea>
				<br>
				<input type="submit" value="submit" class="center btn-grad">
				<hr>
				<p style="text-align:center;">@2026 Acme Support</p>
			</form>
		</fieldset>	
	</body>
</html>
